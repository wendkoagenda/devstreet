name: CI - SECURITE

# Description du workflow :
# - scanner : scanner de securite du depot (backend/scripts/security_scan). Echec des qu'un probleme de niveau
#   avertissement ou plus n'est pas traite par une exception datee (security-exceptions.json).
# L'audit des dependances n'est pas lance ici pour le moment : il sera traite plus tard, hors des pull requests.
# Lancement : par ci-orchestrateur, ou a la main.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scanner:
    name: scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scanner de securite
        working-directory: backend
        run: python -m scripts.security_scan --fail-on warning
