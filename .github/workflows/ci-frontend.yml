name: CI - FRONTEND

# Description du workflow :
# - Lint (ESLint), tests (vitest), puis build de production (tsc -b + vite build).
# Lancement : par ci-orchestrateur, ou a la main (Actions > CI - FRONTEND > Run workflow).

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de production
        env:
          VITE_API_URL: /api
          VITE_API_V1_URL: /api/v1
        run: npm run build
