name: CD - ORCHESTRATEUR

# Description du workflow :
# - Deploie automatiquement une branche (sandbox, main ou prod) apres un push ou un merge dont la CI est verte :
#   appele par `CI - ORCHESTRATEUR` (job deploiement), puis construction des images, puis deploiement.
# - Lancement manuel : choisir la branche dans « Use workflow from » et, pour un retour arriere, un commit complet.
#   Reserve aux GIT_MASTER_USERS.
# - Chaque branche a son environnement GitHub du meme nom, utilisable seulement depuis cette branche : le run
#   s'execute donc toujours sur la branche deployee, avec le fichier de workflow de cette branche.
# - Le mode d'acces a la VM vient de la variable DEPLOY_ACCES de l'environnement : ssh (IP publique et cle privee)
#   ou gcp (sans IP publique, tunnel IAP).
# - Apres deploiement SSH : job observabilite-ssh (Grafana), bloquant. Relance seule possible via
#   Actions > CD - OBSERVABILITE SSH. GCP : pas encore d'observabilite dans ce circuit.
# - En fin de chaine : notifications Slack/Teams (secrets facultatifs SLACK_NOTIF_WEBHOOK / TEAMS_NOTIF_WEBHOOK).

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit complet (40 caracteres). Vide = dernier commit de la branche
        required: false
        type: string

permissions:
  contents: read

# Un seul deploiement a la fois par environnement ; un deploiement en cours n'est jamais interrompu
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  autorisation:
    name: autorisation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branche: ${{ steps.autorisation.outputs.branche }}
      sha: ${{ steps.autorisation.outputs.sha }}
      deployer: ${{ steps.autorisation.outputs.deployer }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Branche, auteur et commit
        id: autorisation
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          branche="$GITHUB_REF_NAME"
          case "$branche" in
            sandbox|main|prod) ;;
            *) echo "::error::Lancer depuis sandbox, main ou prod (« Use workflow from ») : $branche n'a pas d'environnement."; exit 1 ;;
          esac
          deployer=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Liste lue dans develop : une branche feature ne peut pas s'y ajouter
            masters="$(git show origin/develop:git-cli/access_control.conf | sed -n 's/^GIT_MASTER_USERS="\(.*\)"/\1/p')"
            case ",$masters," in
              *",$GITHUB_ACTOR,"*) ;;
              *) echo "::error::$GITHUB_ACTOR n'est pas dans GIT_MASTER_USERS : lancement manuel refuse."; exit 1 ;;
            esac
            if [ -n "$INPUT_SHA" ]; then
              sha="$INPUT_SHA"
            else
              sha="$GITHUB_SHA"
            fi
          else
            sha="$GITHUB_SHA"
            # Les CI ne s'annulent pas et peuvent finir dans le desordre : un commit depasse ne doit pas remplacer un plus recent.
            # API HTTP (pas de git fetch) : persist-credentials reste false, le token n'est pas ecrit dans .git.
            tip="$(curl -sS -f \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branche}" \
              | jq -r '.object.sha')"
            if [ "$sha" != "$tip" ]; then
              deployer=false
              echo "Le commit $sha n'est plus la pointe de $branche : deploiement ignore (un commit plus recent le remplace)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha doit etre un commit complet de 40 caracteres hexadecimaux."
            exit 1
          fi
          {
            echo "branche=$branche"
            echo "sha=$sha"
            echo "deployer=$deployer"
          } >> "$GITHUB_OUTPUT"

  cible:
    name: cible
    needs: autorisation
    if: needs.autorisation.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.autorisation.outputs.branche }}
    outputs:
      acces: ${{ steps.cible.outputs.acces }}
    steps:
      - name: Mode d'acces a la VM
        id: cible
        env:
          ACCES: ${{ vars.DEPLOY_ACCES }}
          BRANCHE: ${{ needs.autorisation.outputs.branche }}
          SHA: ${{ needs.autorisation.outputs.sha }}
        run: |
          set -eu
          case "$ACCES" in
            ssh|gcp) ;;
            *) echo "::error::DEPLOY_ACCES absent ou inconnu dans l'environnement $BRANCHE (« $ACCES »). Voir deploy/README.md."; exit 1 ;;
          esac
          echo "acces=$ACCES" >> "$GITHUB_OUTPUT"
          echo "Deploiement de $SHA sur $BRANCHE (acces : $ACCES)." >> "$GITHUB_STEP_SUMMARY"

  images:
    name: images
    needs: [autorisation, cible]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-build-images.yml
    with:
      sha: ${{ needs.autorisation.outputs.sha }}

  deploiement-ssh:
    name: deploiement-ssh
    needs: [autorisation, cible, images]
    if: needs.cible.outputs.acces == 'ssh'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd-deploiement-ssh.yml
    with:
      branche: ${{ needs.autorisation.outputs.branche }}
      sha: ${{ needs.autorisation.outputs.sha }}
      backend_image: ${{ needs.images.outputs.backend_image }}
      frontend_image: ${{ needs.images.outputs.frontend_image }}
    secrets: inherit

  deploiement-gcp:
    name: deploiement-gcp
    needs: [autorisation, cible, images]
    if: needs.cible.outputs.acces == 'gcp'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/cd-deploiement-gcp.yml
    with:
      branche: ${{ needs.autorisation.outputs.branche }}
      sha: ${{ needs.autorisation.outputs.sha }}
      backend_image: ${{ needs.images.outputs.backend_image }}
      frontend_image: ${{ needs.images.outputs.frontend_image }}
    secrets: inherit

  # Stack Grafana (SSH uniquement pour l'instant) : apres deploy app, bloquant pour notif-succes
  observabilite-ssh:
    name: observabilite-ssh
    needs: [autorisation, cible, images, deploiement-ssh]
    if: needs.cible.outputs.acces == 'ssh' && needs.deploiement-ssh.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/cd-observabilite-ssh.yml
    with:
      branche: ${{ needs.autorisation.outputs.branche }}
      sha: ${{ needs.autorisation.outputs.sha }}
    secrets: inherit

  # MinIO (SSH) : apres deploiement-ssh (reseau proxy), bloquant comme observabilite-ssh
  minio-ssh:
    name: minio-ssh
    needs: [autorisation, cible, images, deploiement-ssh]
    if: needs.cible.outputs.acces == 'ssh' && needs.deploiement-ssh.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/cd-minio-ssh.yml
    with:
      branche: ${{ needs.autorisation.outputs.branche }}
      sha: ${{ needs.autorisation.outputs.sha }}
    secrets: inherit

  # Notifications Slack / Teams : un seul point pour SSH et GCP (secrets facultatifs)
  notif-succes:
    name: notif-succes
    needs: [autorisation, cible, images, deploiement-ssh, deploiement-gcp, observabilite-ssh, minio-ssh]
    if: >-
      always()
      && needs.autorisation.result == 'success'
      && needs.autorisation.outputs.deployer == 'true'
      && needs.cible.result == 'success'
      && needs.images.result == 'success'
      && (
        (needs.cible.outputs.acces == 'ssh'
          && needs.deploiement-ssh.result == 'success'
          && needs.observabilite-ssh.result == 'success'
          && needs.minio-ssh.result == 'success')
        || (needs.cible.outputs.acces == 'gcp' && needs.deploiement-gcp.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.autorisation.outputs.branche }}
    steps:
      - name: Recuperer le commit deploye
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.autorisation.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Notifier le succes
        env:
          SLACK_NOTIF_WEBHOOK: ${{ secrets.SLACK_NOTIF_WEBHOOK }}
          TEAMS_NOTIF_WEBHOOK: ${{ secrets.TEAMS_NOTIF_WEBHOOK }}
          BRANCHE: ${{ needs.autorisation.outputs.branche }}
          SHA: ${{ needs.autorisation.outputs.sha }}
          ACCES: ${{ needs.cible.outputs.acces }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUT: succes
          ETAPE: ""
        run: bash deploy/ci/notify-deploy.sh

  notif-echec:
    name: notif-echec
    needs: [autorisation, cible, images, deploiement-ssh, deploiement-gcp, observabilite-ssh, minio-ssh]
    if: >-
      always()
      && needs.autorisation.result == 'success'
      && needs.autorisation.outputs.deployer == 'true'
      && (
        needs.cible.result == 'failure'
        || needs.cible.result == 'cancelled'
        || needs.images.result == 'failure'
        || needs.images.result == 'cancelled'
        || needs.deploiement-ssh.result == 'failure'
        || needs.deploiement-ssh.result == 'cancelled'
        || needs.deploiement-gcp.result == 'failure'
        || needs.deploiement-gcp.result == 'cancelled'
        || needs.observabilite-ssh.result == 'failure'
        || needs.observabilite-ssh.result == 'cancelled'
        || needs.minio-ssh.result == 'failure'
        || needs.minio-ssh.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.autorisation.outputs.branche }}
    steps:
      - name: Recuperer le commit deploye
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.autorisation.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Notifier l'echec
        env:
          SLACK_NOTIF_WEBHOOK: ${{ secrets.SLACK_NOTIF_WEBHOOK }}
          TEAMS_NOTIF_WEBHOOK: ${{ secrets.TEAMS_NOTIF_WEBHOOK }}
          BRANCHE: ${{ needs.autorisation.outputs.branche }}
          SHA: ${{ needs.autorisation.outputs.sha }}
          ACCES: ${{ needs.cible.outputs.acces }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUT: echec
          CIBLE_RESULT: ${{ needs.cible.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          SSH_RESULT: ${{ needs.deploiement-ssh.result }}
          GCP_RESULT: ${{ needs.deploiement-gcp.result }}
          OBS_RESULT: ${{ needs.observabilite-ssh.result }}
          MINIO_RESULT: ${{ needs.minio-ssh.result }}
        run: |
          set -eu
          etape=""
          case "$CIBLE_RESULT" in failure|cancelled) etape=cible ;; esac
          if [ -z "$etape" ]; then
            case "$IMAGES_RESULT" in failure|cancelled) etape=images ;; esac
          fi
          if [ -z "$etape" ]; then
            case "$SSH_RESULT" in failure|cancelled) etape=deploiement-ssh ;; esac
          fi
          if [ -z "$etape" ]; then
            case "$GCP_RESULT" in failure|cancelled) etape=deploiement-gcp ;; esac
          fi
          if [ -z "$etape" ]; then
            case "$OBS_RESULT" in failure|cancelled) etape=observabilite-ssh ;; esac
          fi
          if [ -z "$etape" ]; then
            case "$MINIO_RESULT" in failure|cancelled) etape=minio-ssh ;; esac
          fi
          export ETAPE="$etape"
          bash deploy/ci/notify-deploy.sh
