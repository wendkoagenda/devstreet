name: CI - BACKEND

# Description du workflow :
# - Verifie qu'il n'y a pas de conflit de migrations (makemigrations --merge) ni de migration manquante
#   (makemigrations --check), sur une base PostgreSQL jetable.
# - Tests Django retires de la CI pour le moment : suite pas encore fiable.
# Lancement : par ci-orchestrateur, ou a la main (Actions > CI - BACKEND > Run workflow).
# Les secrets de test sont generes a chaque execution : aucun secret reel n'est utilise ici.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Base jetable detruite avec le job, jamais exposee : pas de mot de passe
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ci_boilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Variables de test
        run: |
          # Secrets jetables, générés à chaque exécution et masqués dans le journal avant tout usage
          db_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          admin_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          secret_key="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          jwt_signing_key="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          for value in "$db_password" "$admin_password" "$secret_key" "$jwt_signing_key"; do
            echo "::add-mask::$value"
          done
          {
            echo "DEBUG=True"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:5173"
            echo "CSRF_TRUSTED_ORIGINS=http://localhost:5173"
            echo "FRONTEND_URL=http://localhost:5173"
            echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend"
            echo "DEFAULT_FROM_EMAIL=CI <ci@example.com>"
            echo "USE_X_FORWARDED_PROTO=False"
            echo "ENABLE_API_DOCS=True"
            echo "ENABLE_ADMIN=False"
            echo "USE_S3=False"
            echo "DB_NAME=ci_boilerplate"
            echo "DB_USER=postgres"
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "ADMIN_EMAIL=ci-admin@example.com"
            echo "DB_PASSWORD=$db_password"
            echo "ADMIN_PASSWORD=$admin_password"
            echo "SECRET_KEY=$secret_key"
            echo "JWT_SIGNING_KEY=$jwt_signing_key"
          } >> "$GITHUB_ENV"

      - name: Conflits de migrations
        run: |
          output="$(python manage.py makemigrations --merge --dry-run --noinput)"
          echo "$output"
          if ! grep -q "No conflicts detected to merge." <<< "$output"; then
            echo "::error::Conflit de migrations : plusieurs migrations partent de la meme base. Lancer makemigrations --merge en local et commiter la migration de fusion."
            exit 1
          fi

      - name: Migrations manquantes
        run: |
          if ! python manage.py makemigrations --check --dry-run; then
            echo "::error::Des modifications de modeles n'ont pas de migration. Lancer makemigrations en local et commiter le resultat."
            exit 1
          fi
