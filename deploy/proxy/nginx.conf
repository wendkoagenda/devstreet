# Configuration principale du proxy partage. Les sites (un par namespace) sont dans /etc/nginx/sites.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # DNS interne de Docker : les conteneurs sont resolus a la requete (un conteneur absent ne bloque pas le demarrage,
    # et une recreation avec une nouvelle adresse est prise en compte).
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;

    # Le backend et le frontend posent deja ces en-tetes : on garde la seule copie du proxy, pour ne pas les dupliquer.
    # (Un add_header dans un location remplace ceux de ce niveau : les sites les repetent pour /static/ et /media/.)
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tout hote inconnu est coupe (HTTP) ou refuse a la poignee de main (HTTPS)
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/sites/*.conf;
}
