# Proxy partage d'une VM : nginx (80 et 443) et certbot (renouvellement). Installe dans /opt/apps/_proxy par deploy/vm/deployer.sh.
# Contrat : 00readme/README_SAME_ORIGIN_COOKIES.md §3.2. Un fichier par namespace dans ./sites (genere depuis deploy/proxy/site-*.conf.tpl).

name: proxy

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: proxy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/nginx/sites:ro
      - certs:/etc/letsencrypt:ro
      - webroot:/var/www/certbot:ro
      - /srv/public:/srv/public:ro
    networks: [proxy]
    # Recharge toutes les 6 h pour prendre en compte les certificats renouvelles
    command:
      - /bin/sh
      - -c
      - 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    logging: &journaux
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: proxy-certbot
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    networks: [proxy]
    logging: *journaux

networks:
  proxy:
    name: proxy

volumes:
  certs: {}
  webroot: {}
