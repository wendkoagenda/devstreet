# En-têtes de sécurité, inclus dans chaque bloc location (un add_header dans un location
# remplace ceux du niveau supérieur).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP en mode rapport seul : les violations sont visibles dans la console du navigateur sans rien bloquer.
# Après vérification, remplacer par Content-Security-Policy pour l'appliquer.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
