# Central configuration for Git CLI access control
# Comma-separated values, no spaces.

# Master emails authorized for protected branch pushes and protected paths edits
# GIT_MASTER_EMAILS="elisee.wou@gmail.com,lead@company.com,devops@company.com"
GIT_MASTER_EMAILS="elisee.wou@gmail.com,eouedraogo@doonyalabs.com,testdjango2000@gmail.com"

# GitHub usernames allowed to push/merge on protected branches in CI workflow
# GIT_MASTER_USERS="wendkoagenda,lead-user,devops-user"
GIT_MASTER_USERS="wendkoagenda,eouedraogo"

# GitHub usernames responsible for protected zones (regression-guard.json) : mentioned in the PR comment and
# allowed to validate a PR that touches a zone. Distinct from GIT_MASTER_USERS (push/merge on protected branches).
# ZONE_PROTEGEE_USERS="wendkoagenda,lead-user"
ZONE_PROTEGEE_USERS="wendkoagenda"

# Branches restricted by identity for push
IDENTITY_RESTRICTED_BRANCHES="main,develop,prod"

# Paths protected against commit by non-authorized emails.
# Rule:
# - ends with "/" => prefix match (folder)
# - otherwise => exact file match
PROTECTED_PATHS=".github/workflows/,.githooks/,git-cli/,00conventions/,deploy/,backend/scripts/deploy_env/"
